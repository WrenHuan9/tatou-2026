name: Security Checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  sast:
    name: Static Analysis (Bandit)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Bandit
        run: pip install bandit[sarif]

      - name: Run Bandit
        run: |
          bandit -r server/src/ --severity-level medium -f sarif -o bandit.sarif || true

      - name: Upload SARIF result to the GitHub Security Dashboard
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: bandit.sarif
          category: bandit

  semgrep:
    name: Semgrep Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 3
    container:
      image: semgrep/semgrep
    if: github.actor != 'dependabot[bot]'
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Run Semgrep
        run: semgrep scan --config auto --sarif --output semgrep-results.sarif server/src/ || true
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep-results.sarif
          category: semgrep

  sca:
    name: Dependency Vulnerabilities (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Scan dependencies
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: server/
          format: sarif
          output: trivy-sca.sarif
          severity: CRITICAL,HIGH
      - name: Upload to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-sca.sarif
          category: trivy-sca

  container-scan:
    name: Container Security (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
 
      - name: Scan Dockerfile and docker-compose
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: CRITICAL,HIGH
 
      - name: Build image
        run: docker build -t tatou:test server/
 
      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: tatou:test
          format: sarif
          output: trivy-image.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
 
      - name: Upload to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

  tests:
    name: Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 3
 
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: test_root_password
          MARIADB_DATABASE: tatou_test
          MARIADB_USER: tatou_test
          MARIADB_PASSWORD: test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -u root --password=test_root_password --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
          --health-start-period=30s
 
    steps:
      - uses: actions/checkout@v4
 
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
 
      - name: Install dependencies
        run: |
          cd server && pip install -e ".[dev]"
          pip install pytest-cov
 
      - name: Initialize test database
        run: mysql -h 127.0.0.1 -u root -ptest_root_password tatou_test < db/tatou.sql
      - name: Run tests
        env:
          SECRET_KEY: test_secret_key_for_ci
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: tatou_test
          DB_USER: tatou_test
          DB_PASSWORD: test_password
          STORAGE_DIR: /tmp/tatou_test_storage
          TATOU_ENV: testing
        run: |
          mkdir -p /tmp/tatou_test_storage
          cd server
          pytest -v \
            --tb=short \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=html:coverage-report \
            test/
 
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: server/coverage-report/

  dast-baseline:
    name: DAST Baseline (ZAP)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      security-events: write
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: test_root_password
          MARIADB_DATABASE: tatou_test
          MARIADB_USER: tatou_test
          MARIADB_PASSWORD: test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -u root --password=test_root_password --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
          --health-start-period=30s
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install and start application
        env:
          SECRET_KEY: test_secret_key_for_ci
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: tatou_test
          DB_USER: tatou_test
          DB_PASSWORD: test_password
          STORAGE_DIR: /tmp/tatou_storage
        run: |
          cd server && pip install -e .
          pip install gunicorn
          mysql -h 127.0.0.1 -u root -ptest_root_password tatou_test < ../db/tatou.sql
          mkdir -p /tmp/tatou_storage
          gunicorn -b 0.0.0.0:5000 src.server:app &
          timeout 30 bash -c 'until curl -sf http://localhost:5000/healthz; do sleep 2; done'
      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: http://localhost:5000
          allow_issue_writing: false
      - name: Upload ZAP report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          path: zap_scan.zip
          name: zap-baseline-report
